[project]
name = "lymow-console-backend"
version = "0.1.0"
description = "Web control center for the Lymow One / One Plus robotic mower"
requires-python = ">=3.12"
license = { text = "MIT" }
# Protocol layer (app/lymow/) derived from:
#   Lymow-One-MQTT — Copyright (c) 2026 Aaron Gibbs, MIT License
#   https://github.com/Mortimer452/Lymow-One-MQTT
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "websockets>=12",
    "aiohttp>=3.9",
    "paho-mqtt>=2.1",
    "protobuf>=6.31.1",
    "pycognito==2024.5.1",
    "aiosqlite>=0.20",
    "itsdangerous>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
